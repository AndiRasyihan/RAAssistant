<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; }
  #bg { position: absolute; inset: 0; background-size: 100% 100%; }
  #shade { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
  #sel { position: absolute; border: 1.5px solid #8b7cff; box-shadow: 0 0 0 9999px rgba(0,0,0,.35); display: none; }
  #sel span { position: absolute; left: 0; top: -24px; background: #8b7cff; color: #fff; font: 12px "Segoe UI", sans-serif; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  #hint { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(11,11,14,.85); color: #fff; font: 13px "Segoe UI", sans-serif; padding: 7px 14px; border-radius: 16px; }
</style>
</head>
<body>
  <div id="bg"></div><div id="shade"></div><div id="sel"><span></span></div>
  <div id="hint">Seret untuk memilih area · Esc untuk batal</div>
  <script src="area.js"></script>
</body>
</html>
